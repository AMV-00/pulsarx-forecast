<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Twin</title>
<style>
:root{--t2:#a7b0c2;--ok:#6cc7a8;--warn:#d9a648;--bad:#e06a72;--bg:#021524}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:12px/1.3 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:#e9edf5}
body.scan{--bg:#01112a}
.stage{position:relative;height:100%;aspect-ratio:900/1195;max-width:100%;margin:0 auto}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
body.holo #holo, body.scan #scan{display:block}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(2,21,36,.7),0 0 16px 4px var(--c)}
.dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);opacity:.5}
/* flashing only for states that need attention (NASA-STD-3001 App. F.5.11) */
.dot.bad::after{animation:pulse 1.25s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:.9}to{transform:scale(1.5);opacity:0}}
.lbl{position:absolute;transform:translateY(-50%);white-space:nowrap;font-weight:500;color:var(--c);text-shadow:0 1px 3px #000;display:flex;align-items:center;gap:6px}
.lbl small{display:block;color:var(--t2);font-weight:400}
.ln{position:absolute;height:1px;background:var(--c);opacity:.55}
.lbl.l{padding-right:6px}.lbl.r{padding-left:6px}
.lbl.l{flex-direction:row-reverse;text-align:right}
.switch{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px}
.switch button{font:inherit;color:var(--t2);background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer}
.switch button.on{background:rgba(95,216,255,.15);color:#e9edf5}
.cap{position:absolute;right:12px;bottom:16px;color:var(--t2);font-size:11px;opacity:.8}
body.mini .lbl small,body.mini .cap{display:none}
body.mini .switch{left:8px;bottom:8px}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none}}
</style>
</head>
<body class="holo">
<div class="stage" id="stage">
  <img id="holo" src="../assets/twin-holo.jpg" alt="Digital twin of the astronaut, shown as a hologram">
  <img id="scan" src="../assets/twin-scan.jpg" alt="Digital twin of the astronaut, shown as a body scan">
</div>
<div class="switch" role="group" aria-label="Twin view"><button data-s="holo" class="on">Hologram</button><button data-s="scan">Body scan</button></div>
<div class="cap">Image: AI illustration · dots: live twin data</div>
<script>
const mini = location.search.includes('mini');
if(mini) document.body.classList.add('mini');
const COL = {ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)'};
const WORD = {ok:'normal', warn:'off normal', bad:'well off normal'};
// hotspot positions as % of each picture (x, y); side = where the label goes
const SPOTS = {
  head:  {name:'Head',  sub:'Sleep, hours awake', side:'l', holo:[50, 13],   scan:[50, 7]},
  heart: {name:'Heart', sub:'Heart rate, HRV',    side:'l', holo:[57, 25.5], scan:[51.7, 27.6]},
  hand:  {name:'Ring',  sub:'Skin temp, activity',side:'r', holo:[70, 49],   scan:[74.4, 53.6]},
};
const state = {head:'ok', heart:'ok', hand:'ok'};
let style = new URLSearchParams(location.search).get('style') === 'scan' ? 'scan' : 'holo';
const stage = document.getElementById('stage');
function draw(){
  document.body.className = style + (mini ? ' mini' : '');
  document.querySelectorAll('.switch button').forEach(b => b.classList.toggle('on', b.dataset.s === style));
  stage.querySelectorAll('.dot,.lbl,.ln').forEach(e => e.remove());
  for(const k in SPOTS){
    const s = SPOTS[k], [x, y] = s[style], c = COL[state[k]] || COL.ok;
    const d = document.createElement('span'); d.className = 'dot ' + state[k];
    d.style.cssText = `left:${x}%;top:${y}%;--c:${c}`; stage.appendChild(d);
    const l = document.createElement('div'); l.className = 'lbl ' + s.side;
    // labels sit outside the figure; a thin line joins each label to its dot
    const edge = s.side === 'l' ? 27 : 80;
    l.style.cssText = `top:${y}%;--c:${c};` + (s.side === 'l' ? `right:${100 - edge}%` : `left:${edge}%`);
    l.innerHTML = `<span>${s.name}<small>${WORD[state[k]]}</small></span>`;
    const ln = document.createElement('span'); ln.className = 'ln';
    ln.style.cssText = `top:${y}%;--c:${c};left:${Math.min(x, edge) + (s.side === 'l' ? 0.6 : 1.5)}%;width:${Math.abs(x - edge) - 2}%`;
    stage.append(ln, l);
  }
}
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  for(const k in state){ const v = h.get(k); if(v && COL[v]) state[k] = v; }
  draw();
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => { style = b.dataset.s; draw(); });
addEventListener('hashchange', readHash);
addEventListener('message', e => { if(e.data && e.data.twin){ Object.assign(state, e.data.twin); draw(); } });
readHash();
</script>
</body>
</html>
